name: Frontend Next.js

on:
    push:
        branches: [main]
        paths: ["frontend-next/**", "shared/**", ".github/workflows/frontend-next.yml"]
    pull_request:
        paths: ["frontend-next/**", "shared/**", ".github/workflows/frontend-next.yml"]

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: frontend-next
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: frontend-next/package-lock.json
            - run: npm ci
            - run: npm run typecheck
            - run: npm test
            - run: npm run build
